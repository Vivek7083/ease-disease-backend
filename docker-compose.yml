services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: easedisease
      POSTGRES_PASSWORD: easedisease_local
      POSTGRES_DB: easedisease
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U easedisease']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
