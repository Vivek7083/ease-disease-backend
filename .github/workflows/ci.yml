name: ci

# develop = staging line, master = production line. Every pull request into either, and every push to either, is tested.
on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]

# Read-only token, no secrets used anywhere: a pull request from a fork cannot reach anything.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  test:
    name: lint, typecheck, unit tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-node v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate --config prisma7.config.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: end-to-end tests (real Postgres)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: easedisease
          POSTGRES_PASSWORD: easedisease_local
          POSTGRES_DB: easedisease
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U easedisease"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-node v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate --config prisma7.config.ts
      # The suite creates and migrates its own easedisease_test database (test/global-setup.ts).
      - run: npm run test:e2e

  image:
    name: container image builds
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: docker build --target runtime -t ease-disease-api:ci .
      - run: docker build --target migrate -t ease-disease-migrate:ci .

  scripts:
    name: workflow and script checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actionlint 1.7.12 and shellcheck 0.11.0, pinned by digest
      - name: actionlint
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
      - name: shellcheck
        run: >-
          docker run --rm -v "$PWD:/mnt" -w /mnt
          koalaman/shellcheck@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
          --severity=warning infra/bootstrap-staging.sh infra/deploy-staging.sh infra/scheduler-staging.sh
          infra/test/bootstrap-staging.test.sh infra/test/deploy-staging.test.sh infra/test/scheduler-staging.test.sh scripts/docker-smoke.sh
      - name: infrastructure script tests (fake gcloud and curl, no cloud access)
        run: |
          bash infra/test/bootstrap-staging.test.sh
          bash infra/test/deploy-staging.test.sh
          bash infra/test/scheduler-staging.test.sh

  security:
    name: secret scan and dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0 # the secret scan reads the whole history
      # gitleaks v8.30.1, pinned by digest; rules and allowed false positives are in .gitleaks.toml
      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          detect --source /repo --config /repo/.gitleaks.toml --redact --no-banner
      # actions/setup-node v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      # High and critical advisories in production dependencies fail the build unless listed, with a reason and an expiry date, in audit-allowlist.json.
      - run: npm run audit:prod
